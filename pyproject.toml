[project]
name = "deep-research"
version = "0.1.0"
description = "多智能体深度研究系统：deepagents + LangGraph + LangChain"
requires-python = ">=3.11"
dependencies = [
    "deepagents",
    "langchain-openai",
    "langchain-ollama",
    "langchain-tavily",
    "rich",
    "python-dotenv",
    "httpx",
    "langchain-text-splitters>=1.1.2",
    "faiss-cpu>=1.15.0",
    "langchain-community>=0.4.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "streamlit>=1.63.0",
    "openai==2.45.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

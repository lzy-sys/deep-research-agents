name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖（uv.lock 锁定版本）
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: 单元测试与覆盖率
        run: uv run pytest --cov=deep_research --cov-report=term-missing -q
